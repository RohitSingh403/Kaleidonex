name: Keep Supabase Free Tier Active

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (well within the 7-day inactivity pause limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API directly
        run: |
          echo "Pinging Supabase database to prevent free-tier pausing..."
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://gldzqamzidgcxsyjflpu.supabase.co' }}"
          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_ClBS91r3deYMeFnci0iUUw_962q34zQ' }}"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/app_settings?select=key&limit=1")
          
          echo "Supabase Response:"
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Supabase project pinged successfully! Database is active."
          else
            echo "⚠️ Non-200 response received, but network request reached Supabase gateway."
          fi
